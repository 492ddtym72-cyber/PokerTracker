<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100d" />
    <title>PokerTracker · Login</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f4f1e8; background: #07100d; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: radial-gradient(circle at top, rgba(33,91,67,.28), transparent 34rem), #07100d;
      }
      main {
        width: min(100%, 390px);
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 24px;
        padding: 30px;
        background: rgba(13,29,23,.92);
        box-shadow: 0 30px 90px rgba(0,0,0,.26);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .suit { color: #d7b86c; font-size: 30px; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: 36px; }
      .intro { margin: 10px 0 0; color: #8f9e96; font-size: 13px; }
      label { display: grid; gap: 8px; margin-top: 24px; color: #aebbb4; font-size: 12px; font-weight: 700; }
      input {
        width: 100%;
        padding: 14px;
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 12px;
        outline: none;
        background: #0b1713;
        color: #f4f1e8;
        font: inherit;
      }
      input:focus { border-color: #b79b63; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 14px;
        border: 1px solid #b79b63;
        border-radius: 13px;
        background: #b79b63;
        color: #0b110f;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .error, .system-error {
        display: none;
        margin: 14px 0 0;
        color: #e7a096;
        font-size: 12px;
      }
      body[data-error="true"] .error { display: block; }
      body[data-system="true"] .system-error { display: block; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="suit">♠</span>
        <h1>PokerTracker</h1>
      </div>
      <p class="intro" id="login-intro">Gemeinsamer Zugang.</p>

      <form action="/api/login" method="post">
        <label>
          <span id="password-label">Passwort</span>
          <input name="password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button id="login-button" type="submit">Einloggen</button>
        <p class="error" id="password-error">Passwort stimmt nicht.</p>
        <p class="system-error" id="system-error">Login ist gerade nicht verfügbar.</p>
      </form>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      document.body.dataset.error = String(params.has("error"));
      document.body.dataset.system = String(params.has("system"));

      const language = localStorage.getItem("pokertracker-language") === "en" ? "en" : "de";
      document.documentElement.lang = language;

      if (language === "en") {
        document.getElementById("login-intro").textContent = "Shared access.";
        document.getElementById("password-label").textContent = "Password";
        document.getElementById("login-button").textContent = "Log in";
        document.getElementById("password-error").textContent = "Incorrect password.";
        document.getElementById("system-error").textContent = "Login is currently unavailable.";
      }
    </script>
  </body>
</html>
